name: 功能建议
description: 提出创作流程、交互或功能改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述实际使用场景，以及现有流程哪里不方便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 可以附草图、参考或替代方案，并说明设备类型。
    validations:
      required: true
